[project]
name = "cdrdao-processor"
version = "0.1.0"
description = "CD metadata pipeline for cdrdao-ripped images"
requires-python = ">=3.14"
dependencies = [
    "yt-dlp>=2026.3.17",
    "pandas",
    "openpyxl",
    "textual",
    "PyYAML",
    "pydantic-ai",
    "playwright",
    "html2text",
    "openai",
    "python-dotenv",
    "beautifulsoup4",
    "lxml",
    "readability-lxml",
    "fake-useragent>=2.2.0",
    "rich-pixels>=3.0.1",
    "pillow>=12.2.0",
    "libsixel-python>=0.5.0",
    "sixel>=0.2.0",
    "gradio",
    "httpx",
    "mutagen>=1.47.0",
]

[project.scripts]
cdrdao-process = "src.cli.main:main"
cdrdao-enrich = "src.cli.enrich_cmd:main"
cdrdao-artwork = "src.cli.artwork_cmd:main"

[dependency-groups]
dev = [
    "pytest",
]


[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
